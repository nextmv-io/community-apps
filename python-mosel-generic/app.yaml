# This manifest holds the information the app needs to run on the Nextmv Cloud.
type: python
runtime: ghcr.io/nextmv-io/runtime/python:3.11
python:
  # All listed packages will get bundled with the app.
  pip-requirements: pyproject.toml # Can be a requirements.txt

# List all files/directories that should be included in the app. Globbing
# (e.g.: configs/*.json) is supported.
files:
  - main.py
  # If you have a full Xpress license, uncomment the following line and make
  # sure to store your license in that file. Alternatively, provide it as a
  # file secret.
  # - xpauth.xpr

configuration:
  # Specify the format the app reads and writes.
  content:
    format: multi-file # Read and write files from disk.
    multi-file:
      input:
        path: inputs # The Mosel model and its data files.
      output:
        solutions: outputs/solutions # Files written by the model.
        metrics: outputs/metrics.json
  # Options are passed to the model as Mosel parameters. Options prefixed with
  # `xprs_` are passed to the solver as Xpress controls.
  options:
    strict: false
    items:
      - name: model_file
        option_type: string
        default: ""
        description: >-
          Model file (.mos or .bim) to run, relative to the input directory.
          If empty, the first .mos (or .bim) file found is used.
        required: false
      # BEGIN solver options (generated by solver_options.py, do not edit)
      - name: xprs_maxtime
        option_type: int
        description: "Time limit in seconds (negative: stop even if no solution was found yet). Xpress control XPRS_MAXTIME."
        required: false
      - name: xprs_miprelstop
        option_type: float
        description: "Relative MIP gap at which the search stops. Xpress control XPRS_MIPRELSTOP."
        required: false
      - name: xprs_mipabsstop
        option_type: float
        description: "Absolute MIP gap at which the search stops. Xpress control XPRS_MIPABSSTOP."
        required: false
      - name: xprs_maxmipsol
        option_type: int
        description: "Maximum number of MIP solutions to find. Xpress control XPRS_MAXMIPSOL."
        required: false
      - name: xprs_threads
        option_type: int
        description: "Number of threads (-1: determined automatically). Xpress control XPRS_THREADS."
        required: false
      - name: xprs_presolve
        option_type: int
        description: "Presolve (0: off, 1: on, 2: on without removing redundant bounds). Xpress control XPRS_PRESOLVE."
        required: false
      - name: xprs_defaultalg
        option_type: int
        description: "LP algorithm (1: automatic, 2: dual simplex, 3: primal simplex, 4: barrier). Xpress control XPRS_DEFAULTALG."
        required: false
      - name: xprs_cutstrategy
        option_type: int
        description: "Cut strategy (-1: automatic, 0: none, 1: conservative, 2: moderate, 3: aggressive). Xpress control XPRS_CUTSTRATEGY."
        required: false
      - name: xprs_heurstrategy
        option_type: int
        description: "Heuristic strategy (-1: automatic, 0: none, 1: basic, 2: enhanced, 3: extensive). Xpress control XPRS_HEURSTRATEGY."
        required: false
      - name: xprs_outputlog
        option_type: int
        description: "Solver log level (0: off, 1: all messages, 3: errors and warnings, 4: errors). Xpress control XPRS_OUTPUTLOG."
        required: false
      # END solver options
