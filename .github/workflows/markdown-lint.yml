name: markdown lint
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  community-apps-markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - name: git clone
        uses: actions/checkout@v4

      - uses: DavidAnson/markdownlint-cli2-action@v14
        with:
          globs: "**/*.md"
