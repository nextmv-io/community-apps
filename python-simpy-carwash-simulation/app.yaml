# This manifest holds the information the app needs to run on Nextmv.

# Type and runtime specify the language and environment of the app.
type: python
runtime: ghcr.io/nextmv-io/runtime/python:3.11

# Python-specific configurations.
python:
  # All listed packages will get bundled with the app.
  pip-requirements: pyproject.toml # Can be a requirements.txt

# List all files/directories that should be included in the app. Globbing
# (e.g.: configs/*.json) is supported.
files:
  - main.py

# Application configurations.
configuration:
  content:
    format: json
  options:
    strict: false
    items:
      - name: random_seed
        description: Seed for random number generator. Use -1 for a random seed.
        option_type: int
        default: -1
        required: false
        ui:
          control_type: input
          display_name: Random Seed
      - name: sim_time
        description: Total time to run the simulation (in minutes).
        option_type: int
        default: 20
        required: false
        ui:
          control_type: input
          display_name: Simulation Time
